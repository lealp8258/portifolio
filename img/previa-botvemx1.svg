<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#101626"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Fundo escuro #080B12 -->
  <rect width="600" height="340" fill="url(#bgClub)"/>

  <!-- Barra superior do Portal Oficial -->
  <rect x="0" y="0" width="600" height="36" fill="#0F172A"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#10b981"/>
  <text x="205" y="22" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="bold">BOT VEM X1 FC • PORTAL OFICIAL</text>

  <!-- Card Esquerdo: Emblema do Clube e Promoção Divisão 2 -->
  <rect x="20" y="52" width="245" height="268" rx="14" fill="#080B12" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Escudo / Emblema do Bot Vem X1 Fc -->
  <path d="M142 74 L192 92 L192 142 C192 178 142 202 142 202 C142 202 92 178 92 142 L92 92 Z"
        fill="#101626" stroke="url(#shieldGrad)" stroke-width="3"/>
  <text x="142" y="136" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">BVX1</text>
  <text x="142" y="156" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="10" font-weight="bold">FC</text>

  <!-- Título e Badge Divisão 2 -->
  <text x="142" y="232" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">BOT VEM X1 FC</text>
  <text x="142" y="250" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">União dos Crias</text>

  <rect x="67" y="268" width="150" height="30" rx="15" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4"/>
  <text x="142" y="287" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="bold">🏆 PROMOVIDO • DIV 2</text>

  <!-- Card Direito: Escalação Rápida de Titulares (DOM Interativo) -->
  <rect x="282" y="52" width="298" height="268" rx="14" fill="#080B12" stroke="#1E293B" stroke-width="1.5"/>
  <text x="302" y="80" fill="#CBD5E1" font-family="monospace" font-size="11" font-weight="bold">ESCALAÇÃO DE TITULARES (DOM)</text>
  <rect x="495" y="66" width="66" height="20" rx="6" fill="#8b5cf6"/>
  <text x="528" y="80" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="bold">ESCALAR</text>

  <!-- Campo Tático Minimalista -->
  <rect x="302" y="96" width="258" height="204" rx="10" fill="#0c1322" stroke="#1E293B"/>
  <line x1="302" y1="198" x2="560" y2="198" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="431" cy="198" r="28" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Jogadores Titulares no Campo (Nodos Ciano e Violeta) -->
  <!-- Atacantes -->
  <circle cx="385" cy="128" r="11" fill="#06b6d4"/>
  <text x="385" y="132" text-anchor="middle" fill="#000" font-family="monospace" font-size="9" font-weight="bold">9</text>
  <circle cx="477" cy="128" r="11" fill="#06b6d4"/>
  <text x="477" y="132" text-anchor="middle" fill="#000" font-family="monospace" font-size="9" font-weight="bold">11</text>

  <!-- Meio-campo -->
  <circle cx="355" cy="185" r="11" fill="#8b5cf6"/>
  <text x="355" y="189" text-anchor="middle" fill="#FFF" font-family="monospace" font-size="9" font-weight="bold">8</text>
  <circle cx="431" cy="172" r="11" fill="#8b5cf6"/>
  <text x="431" y="176" text-anchor="middle" fill="#FFF" font-family="monospace" font-size="9" font-weight="bold">10</text>
  <circle cx="507" cy="185" r="11" fill="#8b5cf6"/>
  <text x="507" y="189" text-anchor="middle" fill="#FFF" font-family="monospace" font-size="9" font-weight="bold">7</text>

  <!-- Defesa e Goleiro -->
  <circle cx="375" cy="240" r="10" fill="#38bdf8"/>
  <circle cx="487" cy="240" r="10" fill="#38bdf8"/>
  <circle cx="431" cy="278" r="10" fill="#34d399"/>
</svg>

