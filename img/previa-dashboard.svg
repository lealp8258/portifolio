<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Fundo da janela do Dashboard -->
  <rect width="600" height="340" fill="url(#bgDash)"/>

  <!-- Barra superior da janela -->
  <rect x="0" y="0" width="600" height="34" fill="#0F172A"/>
  <circle cx="20" cy="17" r="5" fill="#ef4444"/>
  <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="17" r="5" fill="#10b981"/>
  <rect x="220" y="10" width="160" height="14" rx="7" fill="#1E293B"/>

  <!-- Menu lateral do Dashboard -->
  <rect x="16" y="48" width="95" height="276" rx="10" fill="#101626" stroke="#1E293B"/>
  <rect x="28" y="64" width="55" height="10" rx="5" fill="#06b6d4"/>
  <rect x="28" y="92" width="70" height="8" rx="4" fill="#334155"/>
  <rect x="28" y="112" width="62" height="8" rx="4" fill="#1E293B"/>
  <rect x="28" y="132" width="68" height="8" rx="4" fill="#1E293B"/>
  <rect x="28" y="152" width="50" height="8" rx="4" fill="#1E293B"/>

  <!-- 3 Cards de Indicadores (KPIs) no topo -->
  <rect x="126" y="48" width="145" height="72" rx="10" fill="#101626" stroke="#1E293B"/>
  <rect x="140" y="62" width="60" height="7" rx="3.5" fill="#64748B"/>
  <text x="140" y="95" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="bold">R$ 84.920</text>
  <text x="140" y="110" fill="#34d399" font-family="monospace" font-size="10">+24.5% este mês</text>

  <rect x="284" y="48" width="145" height="72" rx="10" fill="#101626" stroke="#1E293B"/>
  <rect x="298" y="62" width="65" height="7" rx="3.5" fill="#64748B"/>
  <text x="298" y="95" fill="#06b6d4" font-family="monospace" font-size="18" font-weight="bold">12.480</text>
  <text x="298" y="110" fill="#94A3B8" font-family="monospace" font-size="10">Usuários ativos</text>

  <rect x="442" y="48" width="142" height="72" rx="10" fill="#101626" stroke="#1E293B"/>
  <rect x="456" y="62" width="55" height="7" rx="3.5" fill="#64748B"/>
  <text x="456" y="95" fill="#a855f7" font-family="monospace" font-size="18" font-weight="bold">99.8%</text>
  <text x="456" y="110" fill="#34d399" font-family="monospace" font-size="10">Performance</text>

  <!-- Gráfico Principal de Linha (Esquerda) -->
  <rect x="126" y="134" width="295" height="190" rx="10" fill="#101626" stroke="#1E293B"/>
  <rect x="142" y="150" width="110" height="8" rx="4" fill="#CBD5E1"/>
  <line x1="142" y1="190" x2="405" y2="190" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="142" y1="235" x2="405" y2="235" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="142" y1="280" x2="405" y2="280" stroke="#1E293B" stroke-dasharray="4"/>

  <path d="M142 280 L185 250 L230 262 L275 210 L320 225 L365 180 L405 168 L405 300 L142 300 Z" fill="url(#cyanGrad)"/>
  <path d="M142 280 L185 250 L230 262 L275 210 L320 225 L365 180 L405 168" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="275" cy="210" r="4" fill="#06b6d4"/>
  <circle cx="365" cy="180" r="4" fill="#06b6d4"/>
  <circle cx="405" cy="168" r="5" fill="#22d3ee"/>

  <!-- Gráfico de Barras (Direita) -->
  <rect x="434" y="134" width="150" height="190" rx="10" fill="#101626" stroke="#1E293B"/>
  <rect x="450" y="150" width="80" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="454" y="230" width="16" height="72" rx="4" fill="url(#barGrad)"/>
  <rect x="480" y="198" width="16" height="104" rx="4" fill="url(#barGrad)"/>
  <rect x="506" y="245" width="16" height="57" rx="4" fill="url(#barGrad)"/>
  <rect x="532" y="176" width="16" height="126" rx="4" fill="url(#barGrad)"/>
  <rect x="558" y="210" width="14" height="92" rx="4" fill="url(#barGrad)"/>
</svg>

